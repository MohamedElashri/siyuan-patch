name: release-docker
on:
  workflow_dispatch:
    inputs:
      version:
        description: "release version/tag"
        required: true

concurrency:
  group: release-docker-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    permissions:
      packages: write
      contents: read
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v7.0.1
        with:
          path: siyuan-note

      - name: Clone origin and apply patches
        run: |
          git config --global core.autocrlf false
          cd ${{ github.workspace }}/siyuan-note/
          git clone --branch ${{ github.event.inputs.version }} --depth=1 https://github.com/siyuan-note/siyuan.git
          cd siyuan

          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/disable-update.patch
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/default-config.patch
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/mock-vip-user.patch
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/math-renderer-registry.patch
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/docker-build.patch

          git status

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (Optional)
        if: ${{ env.DOCKER_HUB_USER != '' && env.DOCKER_HUB_PWD != '' }}
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PWD }}
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_HUB_PWD: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Build and push Docker image
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER_LOWER="${OWNER,,}"
          TAGS="-t ghcr.io/${OWNER_LOWER}/siyuan:${VERSION}-${ARCH}"
          if [ -n "${DOCKER_HUB_USER}" ]; then
            TAGS="${TAGS} -t ${DOCKER_HUB_USER}/siyuan:${VERSION}-${ARCH}"
          fi
          docker buildx build \
            --push \
            --platform "linux/${ARCH}" \
            ${TAGS} \
            .
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}

  publish:
    name: Publish multi-architecture image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (Optional)
        if: ${{ env.DOCKER_HUB_USER != '' && env.DOCKER_HUB_PWD != '' }}
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PWD }}
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_HUB_PWD: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Publish version and latest tags
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          VERSION: ${{ inputs.version }}
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER_LOWER="${OWNER,,}"
          ghcr_image="ghcr.io/${OWNER_LOWER}/siyuan"
          docker buildx imagetools create \
            -t "${ghcr_image}:${VERSION}" \
            -t "${ghcr_image}:latest" \
            "${ghcr_image}:${VERSION}-amd64" \
            "${ghcr_image}:${VERSION}-arm64"

          if [ -n "${DOCKER_HUB_USER}" ]; then
            hub_image="${DOCKER_HUB_USER}/siyuan"
            docker buildx imagetools create \
              -t "${hub_image}:${VERSION}" \
              -t "${hub_image}:latest" \
              "${hub_image}:${VERSION}-amd64" \
              "${hub_image}:${VERSION}-arm64"
          fi
