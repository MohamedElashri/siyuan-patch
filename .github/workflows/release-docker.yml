name: release-docker
on:
  workflow_dispatch:
    inputs:
      version:
        description: "release version/tag"
        required: true

concurrency:
  group: release-docker-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            onnx_digest: sha256:4f027099cfc94c3715c0ef50891d469ffefa99040edd13800e7fa42dc2a4574d
          - os: ubuntu-24.04-arm
            arch: arm64
            onnx_digest: sha256:e8ce09abf4a191fbb6ac84582f1e77116be55b877d4a8f740b8c54ca31d0c779
    permissions:
      packages: write
      contents: read
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v7.0.1
        with:
          path: siyuan-note

      - name: Clone origin and apply patches
        run: |
          git config --global core.autocrlf false
          cd ${{ github.workspace }}/siyuan-note/
          git clone --branch ${{ github.event.inputs.version }} --depth=1 https://github.com/siyuan-note/siyuan.git
          cd siyuan

          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/disable-update.patch
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/default-config.patch
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/mock-vip-user.patch
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/docker-build.patch

          git status

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Build and push Docker image
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan
        run: |
          build_args=()
          if [[ "$VERSION" == v3.8.11 ]]; then
            # Reuse the same musl ONNX artifacts as the official v3.8.11 builds.
            build_args+=(--build-arg "ONNX_IMAGE=docker.io/b3log/siyuan@${ONNX_DIGEST}")
          fi
          docker buildx build \
            --push \
            --platform "linux/${ARCH}" \
            -t "${DOCKER_HUB_USER}/siyuan:${VERSION}-${ARCH}" \
            "${build_args[@]}" \
            .
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
          ONNX_DIGEST: ${{ matrix.onnx_digest }}

  publish:
    name: Publish multi-architecture image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Publish version and latest tags
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          VERSION: ${{ inputs.version }}
        run: |
          image="${DOCKER_HUB_USER}/siyuan"
          docker buildx imagetools create \
            -t "${image}:${VERSION}" \
            -t "${image}:latest" \
            "${image}:${VERSION}-amd64" \
            "${image}:${VERSION}-arm64"
