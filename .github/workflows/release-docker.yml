name: release-docker
on:
  workflow_dispatch:
    inputs:
      version:
        description: "release version/tag"
        required: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # sanad: ref=v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # sanad: ref=v7
        with:
          path: siyuan-note

      - name: Clone origin and apply patches
        run: |
          git config --global core.autocrlf false
          cd ${{ github.workspace }}/siyuan-note/
          git clone --branch ${{ github.event.inputs.version }} --depth=1 https://github.com/siyuan-note/siyuan.git
          cd siyuan

          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/disable-update.patch
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/default-config.patch
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/mock-vip-user.patch
          sed -i 's/^FROM golang:1\.25-alpine AS go-build$/FROM golang:1.26-alpine AS go-build/' Dockerfile

          git status

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # sanad: ref=v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # sanad: ref=v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Build and push Docker image
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan
        run: |
          docker buildx build \
            --push \
            --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.DOCKER_HUB_USER }}/siyuan:latest \
            -t ${{ secrets.DOCKER_HUB_USER }}/siyuan:${{ github.event.inputs.version }} \
            .
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}