name: release-docker
on:
  workflow_dispatch:
    inputs:
      version:
        description: "release version/tag"
        required: true

concurrency:
  group: release-docker-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    permissions:
      packages: write
      contents: read
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: siyuan-note

      - name: Clone origin and apply patches
        run: |
          git config --global core.autocrlf false
          cd ${{ github.workspace }}/siyuan-note/
          git clone --branch ${{ github.event.inputs.version }} --depth=1 https://github.com/siyuan-note/siyuan.git
          cd siyuan

          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/disable-update.patch
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/default-config.patch
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/mock-vip-user.patch
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/docker-build.patch

          git status

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Build and push Docker image
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan
        run: |
          docker buildx build \
            --push \
            --platform "linux/${ARCH}" \
            -t "${DOCKER_HUB_USER}/siyuan:${VERSION}-${ARCH}" \
            .
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}

  publish:
    name: Publish multi-architecture image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Publish version and latest tags
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          VERSION: ${{ inputs.version }}
        run: |
          image="${DOCKER_HUB_USER}/siyuan"
          docker buildx imagetools create \
            -t "${image}:${VERSION}" \
            -t "${image}:latest" \
            "${image}:${VERSION}-amd64" \
            "${image}:${VERSION}-arm64"
