name: release-ios

on:
  workflow_dispatch:
    inputs:
      version:
        description: "release version/tag"
        required: true
      packageManager:
        description: "pnpm@x.x.x (optional, auto-detected)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
          - os: macos-latest
            kernel_path: "../ios/iosk.xcframework"
            target: "ios"

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: siyuan-note

      - name: clone origin and apply patches
        run: |
          mkdir -p ${{ github.workspace }}/go
          cd ${{ github.workspace }}/siyuan-note/

          git clone --branch ${{ github.event.inputs.version }} --depth=1 https://github.com/siyuan-note/siyuan.git
          cd siyuan

          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/disable-update.patch
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/default-config.patch
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/mock-vip-user.patch

          cd ..

          git clone --depth=1 https://github.com/siyuan-note/siyuan-ios.git
          cd siyuan-ios

          git apply --ignore-whitespace ${{ github.workspace }}/siyuan-note/patches/siyuan-ios/build-failed.patch || true
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan-ios/text-menu-availability.patch

          sed -i '' 's/MARKETING_VERSION =\(.*\)/MARKETING_VERSION = ${{ github.event.inputs.version }};/g' siyuan-ios.xcodeproj/project.pbxproj
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com\.ld246\.siyuan\.ShorthandShare;/PRODUCT_BUNDLE_IDENTIFIER = com.ld246.siyuan.debug.ShorthandShare;/g' siyuan-ios.xcodeproj/project.pbxproj
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com\.ld246\.siyuan;/PRODUCT_BUNDLE_IDENTIFIER = com.ld246.siyuan.debug;/g' siyuan-ios.xcodeproj/project.pbxproj
          git status
          git diff

      - name: Generate app icon from logo.icon
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan-ios
        run: |
          # The logo.icon uses Xcode 26 Icon Composer format (folder.iconcomposer.icon)
          # which actool on CI cannot process. Composite the 4 SVG layers into a
          # traditional appiconset so the asset catalog compiler finds "logo".
          # Layer positions derived from logo.icon/icon.json (scale:2, translations from center)
          cat > /tmp/siyuan_icon.svg << 'SVGEOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <rect width="1024" height="1024" fill="white"/>
            <g transform="translate(160, 208) scale(2)">
              <path d="M0 100L100 0V204L0 304V100Z" fill="#D23F31"/>
            </g>
            <g transform="translate(360, 208) scale(2)">
              <path d="M0 0L76 76V280L0 204V0Z" fill="#3B3E43"/>
            </g>
            <g transform="translate(512, 208) scale(2)">
              <path d="M0 76L76 0V204L0 280V76Z" fill="#D23F31"/>
            </g>
            <g transform="translate(664, 208) scale(2)">
              <path d="M0 0L100 100V304L0 204V0Z" fill="#3B3E43"/>
            </g>
          </svg>
          SVGEOF

          brew install librsvg
          rsvg-convert -w 1024 -h 1024 /tmp/siyuan_icon.svg -o /tmp/siyuan_icon_1024.png

          mkdir -p siyuan-ios/Assets.xcassets/logo.appiconset
          cp /tmp/siyuan_icon_1024.png siyuan-ios/Assets.xcassets/logo.appiconset/logo_1024.png
          cat > siyuan-ios/Assets.xcassets/logo.appiconset/Contents.json << 'EOF'
          {
            "images" : [
              {
                "filename" : "logo_1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

      - name: Set up Go
        id: setup_go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ github.workspace }}/siyuan-note/siyuan/kernel/go.mod
          # Desktop jobs share setup-go's default cache key and can save it first.
          cache: false

      - name: Configure iOS Go cache
        id: go_cache
        run: |
          go version
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Cache iOS Go packages
        uses: actions/cache@v5.1.0
        with:
          path: |
            ${{ steps.go_cache.outputs.build }}
            ${{ steps.go_cache.outputs.modules }}
          # Restore previous releases, then save newly compiled iOS packages.
          key: ios-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup_go.outputs.go-version }}-${{ steps.go_cache.outputs.xcode }}-${{ hashFiles('siyuan-note/siyuan/kernel/go.sum') }}-${{ inputs.version }}-${{ github.sha }}
          restore-keys: |
            ios-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup_go.outputs.go-version }}-${{ steps.go_cache.outputs.xcode }}-${{ hashFiles('siyuan-note/siyuan/kernel/go.sum') }}-
            ios-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup_go.outputs.go-version }}-${{ steps.go_cache.outputs.xcode }}-

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Install Node pnpm
        run: |
          PM=${{ github.event.inputs.packageManager }}
          if [ -z "$PM" ]; then
            PM=$(grep '"packageManager"' package.json | head -1 | awk -F: '{print $2}' | sed 's/[", ]//g')
          fi
          echo "Using pnpm: $PM"
          npm install -g "$PM"
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: Building UI
        run: pnpm run build
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: gomobile
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/kernel
        run: |
          mobile_version="$(go list -m -f '{{.Version}}' golang.org/x/mobile)"
          go install "golang.org/x/mobile/cmd/gomobile@${mobile_version}"
          go install "golang.org/x/mobile/cmd/gobind@${mobile_version}"
          gobin="$(go env GOPATH)/bin"
          echo "${gobin}" >> "$GITHUB_PATH"
          # For iOS, initialize the tool directory without init's gobind@latest install.
          mkdir -p "$(go env GOPATH)/pkg/gomobile"

      - name: Building ios Kernel
        run: |
          # The release IPA needs the device slice; -target=ios also builds simulators.
          gomobile bind -tags "fts5 sqlcipher" -ldflags '-s -w' -v -target=ios/arm64 -o "${{ matrix.config.kernel_path }}" ./
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/kernel/mobile
        env:
          GO111MODULE: on
          CGO_ENABLED: 1

      - name: ios assets
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app/
        run: |
          mkdir -p ${{ github.workspace }}/siyuan-note/siyuan-ios/app/
          cp -r ./appearance ./guide ./stage ./changelogs ${{ github.workspace }}/siyuan-note/siyuan-ios/app/

      - name: Building iOS
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan-ios
        run: |
          mkdir -p ../siyuan-ios-out/Payload
          xcodebuild -workspace ./siyuan-ios.xcodeproj/project.xcworkspace -scheme siyuan-ios -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -derivedDataPath ../siyuan-ios-out
          mv ../siyuan-ios-out/Build/Products/Release-iphoneos/siyuan-ios.app ../siyuan-ios-out/Payload
          cd ../siyuan-ios-out
          zip -r Payload.zip Payload
          mv Payload.zip siyuan.ipa

      - uses: joutvhu/get-release@v1.0.4
        id: get_current_release
        with:
          tag_name: ${{ github.event.inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ios.ipa
        uses: shogo82148/actions-upload-release-asset@v1.10.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_current_release.outputs.upload_url }}
          asset_name: siyuan-${{ github.event.inputs.version }}-ios.ipa
          asset_path: ${{ github.workspace }}/siyuan-note/siyuan-ios-out/siyuan.ipa
          asset_content_type: application/octet-stream
          overwrite: true

  update-readme:
    name: Update README with version
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README.md with version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          TAG="v${VERSION}"
          # Replace any existing version or latest with new version (matching release asset naming siyuan-vX.Y.Z-)
          sed -E -i "s#siyuan-(v?[0-9][0-9.]*|latest)-#siyuan-${TAG}-#g" README.md
          
          # Verify changes
          git diff README.md
          
          # Commit and push if there are changes
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update README with version ${TAG}"
            git pull --rebase origin main || true
            git push
          else
            echo "No changes to README.md"
          fi

  checksums:
    name: Update release checksums
    needs: build
    uses: ./.github/workflows/release-checksums.yml
    with:
      version: ${{ github.event.inputs.version }}
    permissions:
      contents: write
