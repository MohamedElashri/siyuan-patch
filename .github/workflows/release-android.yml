name: release-android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "release version/tag"
        required: true
      packageManager:
        description: "pnpm@x.x.x (optional, auto-detected)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
          - os: ubuntu-22.04
            kernel_path: "../../../siyuan-android/app/libs/kernel.aar"

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: siyuan-note

      - name: clone origin and apply patches
        run: |
          mkdir -p ${{ github.workspace }}/go
          cd ${{ github.workspace }}/siyuan-note/

          git clone --branch ${{ github.event.inputs.version }} --depth=1 https://github.com/siyuan-note/siyuan.git
          cd siyuan

          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/disable-update.patch
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/default-config.patch
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/mock-vip-user.patch
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/math-renderer-registry.patch

          git status

          cd ..

          git clone --branch ${{ github.event.inputs.version }} --depth=1 https://github.com/siyuan-note/siyuan-android.git
          cd siyuan-android

          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan-android/debug-build.patch

          mkdir -p app/src/main/assets/
          mkdir -p app/libs/

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ github.workspace }}/siyuan-note/siyuan/kernel/go.mod
          cache-dependency-path: "**/*.sum"
      - run: go version

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Install Node pnpm
        run: |
          PM=${{ github.event.inputs.packageManager }}
          if [ -z "$PM" ]; then
            PM=$(grep '"packageManager"' package.json | head -1 | awk -F: '{print $2}' | sed 's/[", ]//g')
          fi
          echo "Using pnpm: $PM"
          npm install -g "$PM"
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: Building UI
        run: pnpm run build
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: gomobile
        working-directory: ${{ github.workspace }}/go
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Set up java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Building Android Kernel
        run: |
          gomobile bind -tags "fts5 sqlcipher" -androidapi 21 -target='android/arm64'  -ldflags '-s -w' -v -o "${{ matrix.config.kernel_path }}" ./
          ls -la "${{ matrix.config.kernel_path }}"
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/kernel/mobile
        env:
          GO111MODULE: on
          CGO_ENABLED: 1

      - name: android assets
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app/
        run: |
          zip -r ${{ github.workspace }}/siyuan-note/siyuan-android/app/src/main/assets/app.zip ./appearance ./guide ./stage ./changelogs

      - name: Fix Gradle repositories (replace unreliable aliyun mirrors)
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan-android
        run: |
          # Fix root build.gradle - replace aliyun repos with google/mavenCentral as primary
          sed -i "s|maven { url 'https://maven.aliyun.com/repository/google' }|google()|g" build.gradle
          sed -i "s|maven { url 'https://maven.aliyun.com/repository/public' }|mavenCentral()|g" build.gradle
          sed -i "s|maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }||g" build.gradle
          
          # Fix app/build.gradle - add google() and mavenCentral() to repositories
          sed -i "/repositories {/a\\
                  google()\\
                  mavenCentral()\\
          " app/build.gradle
          
          echo "=== Root build.gradle ==="
          cat build.gradle
          echo "=== App build.gradle ==="
          cat app/build.gradle

      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v2.0.0
        with:
          fileName: "debug.jks"
          fileDir: ${{ github.workspace }}/siyuan-note/siyuan-android/keystore
          encodedString: ${{ secrets.KEYSTORE }}

      - name: Building Android
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan-android
        run: |
          chmod 777 ./gradlew
          ./gradlew :app:assembleDebug --refresh-dependencies --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - uses: joutvhu/get-release@v1.0.4
        id: get_current_release
        with:
          tag_name: ${{ github.event.inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Android
        uses: shogo82148/actions-upload-release-asset@v1.10.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_current_release.outputs.upload_url }}
          asset_name: siyuan-${{ github.event.inputs.version }}-android-arm64.apk
          asset_path: ${{ github.workspace }}/siyuan-note/siyuan-android/app/build/outputs/apk/googleplay/debug/siyuan-*.apk
          asset_content_type: application/octet-stream
          overwrite: true

  update-readme:
    name: Update README with version
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README.md with version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          TAG="v${VERSION}"
          # Replace any existing version or latest with new version (matching release asset naming siyuan-vX.Y.Z-)
          sed -E -i "s#siyuan-(v?[0-9][0-9.]*|latest)-#siyuan-${TAG}-#g" README.md
          
          # Verify changes
          git diff README.md
          
          # Commit and push if there are changes
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update README with version ${TAG}"
            git pull --rebase origin main || true
            git push
          else
            echo "No changes to README.md"
          fi

  checksums:
    name: Update release checksums
    needs: build
    uses: ./.github/workflows/release-checksums.yml
    with:
      version: ${{ github.event.inputs.version }}
    permissions:
      contents: write
