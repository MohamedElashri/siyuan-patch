name: release-pc

on:
  workflow_dispatch:
    inputs:
      version:
        description: "release version/tag"
        required: true
      packageManager:
        description: "pnpm@x.x.x (optional, auto-detected)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
          - os: ubuntu-22.04
            kernel_path: "../app/kernel-linux/SiYuan-Kernel"
            build_args: "-s -w -X github.com/siyuan-note/siyuan/kernel/util.Mode=prod"
            electron_args: "dist-linux"
            goos: "linux"
            goarch: "amd64"
            deb_arch: "amd64"
            unpacked_dir: "linux-unpacked"
            suffix: "linux.tar.gz"
            appimage_suffix: "linux.AppImage"
            appimage_arch: "x86_64"
            appimagetool_sha256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
            appimage_runtime_sha256: "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"
            rpm_suffix: "linux.rpm"
            electron_config: "electron-builder-linux.yml"
            electron_arch: "x64"
            pacman_arch: "x86_64"
            pacman_suffix: "archlinux-x86_64.pkg.tar.zst"
          - os: ubuntu-24.04-arm
            kernel_path: "../app/kernel-linux-arm64/SiYuan-Kernel"
            build_args: "-s -w -X github.com/siyuan-note/siyuan/kernel/util.Mode=prod"
            electron_args: "dist-linux-arm64"
            goos: "linux"
            goarch: "arm64"
            deb_arch: "arm64"
            unpacked_dir: "linux-arm64-unpacked"
            suffix: "linux-arm64.tar.gz"
            appimage_suffix: "linux-arm64.AppImage"
            appimage_arch: "aarch64"
            appimagetool_sha256: "f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158"
            appimage_runtime_sha256: "00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444"
            rpm_suffix: "linux-arm64.rpm"
            electron_config: "electron-builder-linux-arm64.yml"
            electron_arch: "arm64"
            pacman_arch: "aarch64"
            pacman_suffix: "archlinux-aarch64.pkg.tar.zst"
          - os: macos-latest
            kernel_path: "../app/kernel-darwin/SiYuan-Kernel"
            build_args: "-s -w -X github.com/siyuan-note/siyuan/kernel/util.Mode=prod"
            electron_args: "dist-darwin"
            goos: "darwin"
            goarch: "amd64"
            suffix: "mac.dmg"
          - os: macos-latest
            kernel_path: "../app/kernel-darwin-arm64/SiYuan-Kernel"
            build_args: "-s -w -X github.com/siyuan-note/siyuan/kernel/util.Mode=prod"
            electron_args: "dist-darwin-arm64"
            goos: "darwin"
            goarch: "arm64"
            suffix: "mac-arm64.dmg"
          - os: windows-latest
            kernel_path: "../app/kernel/SiYuan-Kernel.exe"
            build_args: "-s -w -H=windowsgui -X github.com/siyuan-note/siyuan/kernel/util.Mode=prod"
            electron_args: "dist"
            goos: "windows"
            gobin: "bin"
            mingwsys: "MINGW64"
            msys_packages: "p7zip mingw-w64-x86_64-lua"
            goarch: "amd64"
            suffix: "win.exe"
          - os: windows-11-arm
            kernel_path: "../app/kernel-arm64/SiYuan-Kernel.exe"
            build_args: "-s -w -H=windowsgui -X github.com/siyuan-note/siyuan/kernel/util.Mode=prod"
            electron_args: "dist-arm64"
            goos: "windows"
            gobin: "bin"
            mingwsys: "CLANGARM64"
            msys_packages: "p7zip mingw-w64-clang-aarch64-clang"
            goarch: "arm64"
            suffix: "win-arm64.exe"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # sanad: ref=v7
        with:
          path: siyuan-note

      - name: Format version number (Unix)
        id: format_version_unix
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Remove 'v' prefix if present
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Format version number (Windows)
        id: format_version_windows
        if: runner.os == 'Windows'
        run: |
          $VERSION = "${{ github.event.inputs.version }}"
          # Remove 'v' prefix if present
          if ($VERSION.StartsWith("v")) {
            $VERSION = $VERSION.Substring(1)
          }
          "version=$VERSION" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: pwsh

      - name: clone origin and apply patches
        run: |
          mkdir -p ${{ github.workspace }}/go
          cd ${{ github.workspace }}/siyuan-note/

          # Clone the repository without checking out any branch
          git clone https://github.com/siyuan-note/siyuan.git
          cd siyuan
          
          # Fetch the specific tag/version
          git fetch origin ${{ github.event.inputs.version }}
          
          # Hard reset to the tag/version
          git reset --hard FETCH_HEAD
          
          # Apply patches with force and ignoring whitespace
          git apply --ignore-whitespace --reject ${{ github.workspace }}/siyuan-note/patches/siyuan/disable-update.patch || true
          git apply --ignore-whitespace --reject ${{ github.workspace }}/siyuan-note/patches/siyuan/default-config.patch || true
          git apply --ignore-whitespace --reject ${{ github.workspace }}/siyuan-note/patches/siyuan/mock-vip-user.patch || true
          
          # Show status but don't fail if there are changes
          git status || true

      - name: Set up MSYS2/MinGW
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # sanad: ref=v2
        if: contains( matrix.config.goos, 'windows')
        with:
          msystem: ${{ matrix.config.mingwsys }}
          install: ${{ matrix.config.msys_packages }}

      - name: Configure Windows ARM64 C compiler
        if: matrix.config.goos == 'windows' && matrix.config.goarch == 'arm64'
        shell: pwsh
        run: |
          $clang = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "clangarm64\bin\clang.exe"
          if (-not (Test-Path $clang)) {
            throw "ARM64 C compiler not found at $clang"
          }
          $target = (& $clang -dumpmachine).Trim()
          if ($target -notmatch '^aarch64-w64-') {
            throw "Unexpected ARM64 C compiler target: $target"
          }
          "CC=$clang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up TDM-GCC
        run: msys2 -c "bash siyuan-note/siyuan/scripts/get-tdm-gcc.sh tdm https://github.com/jmeubank/tdm-gcc/releases/download/v10.3.0-tdm-1/tdm-gcc-10.3.0.exe" && echo "CC=${{ github.workspace }}/tdm/bin/gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        if: contains( matrix.config.goarch, '386')
        working-directory: ${{ github.workspace }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # sanad: ref=v7
        with:
          go-version-file: ${{ github.workspace }}/siyuan-note/siyuan/kernel/go.mod
          cache-dependency-path: "**/*.sum"
      - run: go version

      - name: Set up goversioninfo
        run: go get github.com/josephspurrier/goversioninfo/cmd/goversioninfo && go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo
        if: contains( matrix.config.goos, 'windows')
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/kernel
        env:
          GO111MODULE: on
          CGO_ENABLED: 1
          GOOS: ${{ matrix.config.goos }}
          GOPATH: ${{ github.workspace }}/go
          GOARCH: ${{ matrix.config.goarch }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # sanad: ref=v7
        with:
          node-version: 22

      - name: Install Node pnpm
        run: |
          PM=${{ github.event.inputs.packageManager }}
          if [ -z "$PM" ]; then
            PM=$(grep '"packageManager"' package.json | head -1 | awk -F: '{print $2}' | sed 's/[", ]//g')
          fi
          echo "Using pnpm: $PM"
          npm install -g "$PM"
        shell: bash
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: Building UI
        run: pnpm run build
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: Generate Icon Resource and Properties/Version Info For Windows
        run: ${{ github.workspace }}\go\${{ matrix.config.gobin }}\goversioninfo -platform-specific=true -icon="resource\icon.ico" -manifest="resource\goversioninfo.exe.manifest"
        if: contains( matrix.config.goos, 'windows')
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/kernel

      - name: Building Kernel
        run: go build --tags fts5 -o "${{ matrix.config.kernel_path }}" -v -ldflags "${{ matrix.config.build_args }}"
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/kernel
        env:
          GO111MODULE: on
          CGO_ENABLED: 1
          GOOS: ${{ matrix.config.goos }}
          GOPATH: ${{ github.workspace }}/go
          GOARCH: ${{ matrix.config.goarch }}

      - name: Install Linux packaging dependencies
        if: matrix.config.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev imagemagick libarchive-tools rpm zstd

      - name: Building Electron
        run: pnpm run ${{ matrix.config.electron_args }}
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: Repack AppImage with update information
        if: matrix.config.goos == 'linux'
        env:
          APPIMAGE_ARCH: ${{ matrix.config.appimage_arch }}
          APPIMAGETOOL_SHA256: ${{ matrix.config.appimagetool_sha256 }}
          APPIMAGE_RUNTIME_SHA256: ${{ matrix.config.appimage_runtime_sha256 }}
          APPIMAGE_SUFFIX: ${{ matrix.config.appimage_suffix }}
          UPDATE_INFORMATION: zsync|https://github.com/${{ github.repository }}/releases/latest/download/siyuan-${{ matrix.config.appimage_arch }}.AppImage.zsync
        run: |
          set -euo pipefail

          build_dir="${GITHUB_WORKSPACE}/siyuan-note/siyuan/app/build"
          source_appimage="$(find "${build_dir}" -maxdepth 1 -type f -name "siyuan-*-${APPIMAGE_SUFFIX}" -print -quit)"
          if [ -z "${source_appimage}" ]; then
            echo "Could not find the Electron Builder AppImage"
            exit 1
          fi

          tool="${RUNNER_TEMP}/appimagetool-${APPIMAGE_ARCH}.AppImage"
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${APPIMAGE_ARCH}.AppImage" \
            --output "${tool}"
          echo "${APPIMAGETOOL_SHA256}  ${tool}" | sha256sum --check --status
          chmod +x "${source_appimage}" "${tool}"

          runtime="${RUNNER_TEMP}/runtime-${APPIMAGE_ARCH}"
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${APPIMAGE_ARCH}" \
            --output "${runtime}"
          echo "${APPIMAGE_RUNTIME_SHA256}  ${runtime}" | sha256sum --check --status

          work_dir="${RUNNER_TEMP}/siyuan-appimage-${APPIMAGE_ARCH}"
          mkdir -p "${work_dir}"
          cd "${work_dir}"
          "${source_appimage}" --appimage-extract

          output_appimage="${build_dir}/siyuan-${APPIMAGE_ARCH}.AppImage"
          ARCH="${APPIMAGE_ARCH}" APPIMAGETOOL_EXTRACT_AND_RUN=1 \
            "${tool}" --runtime-file "${runtime}" squashfs-root \
            -u "${UPDATE_INFORMATION}" "${output_appimage}"

          # Generate zsync file manually since appimagetool 1.9.1 doesn't always create it
          if command -v zsyncmake >/dev/null 2>&1; then
            echo "Generating zsync file with zsyncmake..."
            zsyncmake -u "${UPDATE_INFORMATION}" "${output_appimage}"
          else
            echo "Installing zsyncmake..."
            apt-get update && apt-get install -y zsync
            zsyncmake -u "${UPDATE_INFORMATION}" "${output_appimage}"
          fi

          # Debug: list files to verify outputs
          echo "=== Build directory contents ==="
          ls -la "${build_dir}/"
          echo "=== Expected output ==="
          ls -la "${output_appimage}" "${output_appimage}.zsync" 2>&1 || true

          test -s "${output_appimage}"
          test -s "${output_appimage}.zsync"

      - name: Create DEB Package
        if: matrix.config.goos == 'linux'
        run: |
          # Create directory structure for deb package
          mkdir -p siyuan-deb/DEBIAN
          mkdir -p siyuan-deb/usr/lib/siyuan
          mkdir -p siyuan-deb/usr/share/applications
          mkdir -p siyuan-deb/usr/share/icons/hicolor/512x512/apps
          
          # Copy application files
          cp -r ${{ github.workspace }}/siyuan-note/siyuan/app/build/${{ matrix.config.unpacked_dir }}/* siyuan-deb/usr/lib/siyuan/
          
          # Create desktop entry
          cat > siyuan-deb/usr/share/applications/siyuan.desktop << EOF
          [Desktop Entry]
          Name=SiYuan
          Comment=A personal knowledge management system
          Exec=/usr/lib/siyuan/siyuan
          Icon=siyuan
          Terminal=false
          Type=Application
          Categories=Office;
          StartupWMClass=org.b3log.siyuan
          EOF
          
          # Download and convert icon
          wget https://raw.githubusercontent.com/siyuan-note/siyuan/refs/heads/master/kernel/resource/icon.ico -O siyuan.ico
          convert siyuan.ico[0] -resize 512x512 siyuan-deb/usr/share/icons/hicolor/512x512/apps/siyuan.png
          
          # Create control file
          cat > siyuan-deb/DEBIAN/control << EOF
          Package: siyuan
          Version: ${{ steps.format_version_unix.outputs.version || steps.format_version_windows.outputs.version }}
          Section: office
          Priority: optional
          Architecture: ${{ matrix.config.deb_arch }}
          Maintainer: melashri <siyuan@elashri.com>
          Description: SiYuan Note-Taking Software
           SiYuan is a personal knowledge management system that supports 
           building a personal knowledge base.
          EOF
          
          # Build deb package
          fakeroot dpkg-deb --build siyuan-deb
          mv siyuan-deb.deb siyuan-${{ github.event.inputs.version }}-${{ matrix.config.deb_arch }}.deb

      - uses: joutvhu/get-release@8c3531bba0d249f5e7c3d7e1954d34db9edf2a90 # sanad: ref=v1
        id: get_current_release
        with:
          tag_name: ${{ github.event.inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Electron App
        uses: shogo82148/actions-upload-release-asset@aaba0f56bdbc1071f4af234d5cb16055e8a400de # sanad: ref=v1.10.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_current_release.outputs.upload_url }}
          asset_name: siyuan-${{ github.event.inputs.version }}-${{ matrix.config.suffix }}
          asset_path: ${{ github.workspace }}/siyuan-note/siyuan/app/build/siyuan-*-${{ matrix.config.suffix }}
          asset_content_type: application/octet-stream
          overwrite: true

      - name: Upload DEB Package
        if: matrix.config.goos == 'linux'
        uses: shogo82148/actions-upload-release-asset@aaba0f56bdbc1071f4af234d5cb16055e8a400de # sanad: ref=v1.10.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_current_release.outputs.upload_url }}
          asset_name: siyuan-${{ github.event.inputs.version }}-${{ matrix.config.deb_arch }}.deb
          asset_path: ${{ github.workspace }}/siyuan-${{ github.event.inputs.version }}-${{ matrix.config.deb_arch }}.deb
          asset_content_type: application/vnd.debian.binary-package
          overwrite: true

      - name: Upload AppImage
        if: matrix.config.goos == 'linux'
        uses: shogo82148/actions-upload-release-asset@aaba0f56bdbc1071f4af234d5cb16055e8a400de # sanad: ref=v1.10.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_current_release.outputs.upload_url }}
          asset_name: siyuan-${{ matrix.config.appimage_arch }}.AppImage
          asset_path: ${{ github.workspace }}/siyuan-note/siyuan/app/build/siyuan-${{ matrix.config.appimage_arch }}.AppImage
          asset_content_type: application/octet-stream
          overwrite: true

      - name: Upload AppImage update information
        if: matrix.config.goos == 'linux'
        uses: shogo82148/actions-upload-release-asset@aaba0f56bdbc1071f4af234d5cb16055e8a400de # sanad: ref=v1.10.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_current_release.outputs.upload_url }}
          asset_name: siyuan-${{ matrix.config.appimage_arch }}.AppImage.zsync
          asset_path: ${{ github.workspace }}/siyuan-note/siyuan/app/build/siyuan-${{ matrix.config.appimage_arch }}.AppImage.zsync
          asset_content_type: application/octet-stream
          overwrite: true

      - name: Upload RPM Package
        if: matrix.config.goos == 'linux'
        uses: shogo82148/actions-upload-release-asset@aaba0f56bdbc1071f4af234d5cb16055e8a400de # sanad: ref=v1.10.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_current_release.outputs.upload_url }}
          asset_name: siyuan-${{ github.event.inputs.version }}-${{ matrix.config.rpm_suffix }}
          asset_path: ${{ github.workspace }}/siyuan-note/siyuan/app/build/siyuan-*-${{ matrix.config.rpm_suffix }}
          asset_content_type: application/x-rpm
          overwrite: true

      - name: Build Arch Linux Package
        if: matrix.config.goos == 'linux'
        run: |
          pnpm exec electron-builder \
            --linux pacman \
            --${{ matrix.config.electron_arch }} \
            --config "${{ matrix.config.electron_config }}" \
            --config.pacman.artifactName="siyuan-${{ steps.format_version_unix.outputs.version }}-archlinux-${{ matrix.config.pacman_arch }}.pkg.tar.zst" \
            --config.pacman.packageName=siyuan \
            --config.pacman.compression=zstd \
            --publish=never

          package="build/siyuan-${{ steps.format_version_unix.outputs.version }}-archlinux-${{ matrix.config.pacman_arch }}.pkg.tar.zst"
          test -s "${package}"
          zstd --test "${package}"

          package_arch="$(bsdtar -xOf "${package}" .PKGINFO | sed -n 's/^arch = //p')"
          if [ "${package_arch}" != "${{ matrix.config.pacman_arch }}" ]; then
            echo "Unexpected Arch package architecture: ${package_arch}"
            exit 1
          fi
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: Upload Arch Linux Package
        if: matrix.config.goos == 'linux'
        uses: shogo82148/actions-upload-release-asset@aaba0f56bdbc1071f4af234d5cb16055e8a400de # sanad: ref=v1.10.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_current_release.outputs.upload_url }}
          asset_name: siyuan-${{ github.event.inputs.version }}-${{ matrix.config.pacman_suffix }}
          asset_path: ${{ github.workspace }}/siyuan-note/siyuan/app/build/siyuan-*-archlinux-${{ matrix.config.pacman_arch }}.pkg.tar.zst
          asset_content_type: application/octet-stream
          overwrite: true

  update-readme:
    name: Update README with version
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # sanad: ref=v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README.md with version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${VERSION#v}"
          # Replace any existing version or latest with new version
          sed -i "s|siyuan-v[0-9][0-9.]*\-|siyuan-${VERSION}-|g" README.md
          sed -i "s|siyuan-latest-|siyuan-${VERSION}-|g" README.md

          # AppImages use stable architecture-specific asset names.
          python3 - <<'PY'
          import os
          from pathlib import Path

          readme = Path("README.md")
          lines = readme.read_text().splitlines(keepends=True)
          appimage_rows = [i for i, line in enumerate(lines) if line.startswith("| AppImage |")]
          if len(appimage_rows) != 1:
              raise SystemExit(f"Expected one AppImage row in README.md, found {len(appimage_rows)}")

          repository = os.environ["REPOSITORY"]
          download_base = f"https://github.com/{repository}/releases/latest/download"
          newline = "\n" if lines[appimage_rows[0]].endswith("\n") else ""
          lines[appimage_rows[0]] = (
              f"| AppImage | [Download]({download_base}/siyuan-x86_64.AppImage) "
              f"| [Download]({download_base}/siyuan-aarch64.AppImage) |{newline}"
          )
          readme.write_text("".join(lines))
          PY
          
          # Verify changes
          git diff README.md
          
          # Commit and push if there are changes
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update README with version ${VERSION}"
            git push
          else
            echo "No changes to README.md"
          fi

  checksums:
    name: Update release checksums
    needs: build
    uses: ./.github/workflows/release-checksums.yml
    with:
      version: ${{ github.event.inputs.version }}
    permissions:
      contents: write
